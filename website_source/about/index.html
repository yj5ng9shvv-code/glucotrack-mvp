<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About GlukoTrack</title>
  <meta name="description" content="GlukoTrack is a multilingual diabetes diary with AI assistant, SOS card, family monitoring and data sync.">
  <meta property="og:title" content="About GlukoTrack">
  <meta property="og:description" content="Smart diabetes self-management tools in one app.">
  <link rel="canonical" href="https://glukotrack.com/about/">
  <link rel="stylesheet" href="./about.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span>G</span>GlukoTrack</a>
    <nav>
      <a href="/app/">Web App</a>
      <a href="/help/">Help Center</a>
      <a href="/about/" data-key="title">About GlukoTrack</a>
    </nav>
    <select id="localeSelect" aria-label="Language"></select>
  </header>

  <main id="about" class="about-shell" aria-live="polite">
    <section class="hero">
      <p class="eyebrow">GlukoTrack</p>
      <h1 data-field="hero.title">About GlukoTrack</h1>
      <p data-field="hero.subtitle"></p>
      <div class="hero-actions">
        <a class="button primary" href="/app/" data-field="hero.startButton">Start using</a>
        <a class="button ghost" href="#features" data-field="hero.featuresButton">Explore features</a>
        <a class="button ghost" href="/#download" data-field="hero.downloadButton">Download app</a>
      </div>
    </section>

    <section class="section">
      <h2 data-field="whatIs.title">What is GlukoTrack</h2>
      <div id="paragraphs" class="text-stack"></div>
    </section>

    <section id="features" class="section">
      <h2 data-field="advantagesTitle">Main benefits</h2>
      <div id="advantages" class="feature-grid"></div>
    </section>

    <section class="disclaimer" role="note">
      <h2 data-field="medicalDisclaimer.title">Medical notice</h2>
      <p data-field="medicalDisclaimer.text"></p>
    </section>

    <section class="section meta">
      <h2>GlukoTrack</h2>
      <div class="meta-grid" id="metaLinks"></div>
    </section>
  </main>

  <script src="./about.js" type="module"></script>
</body>
</html>
