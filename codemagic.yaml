workflows:
  android_release:
    name: Android signed release
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      flutter: stable
      groups:
        - android_release_signing
      vars:
        API_BASE_URL: https://glukotrack.com/api
    scripts:
      - name: Restore production keystore
        script: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          export ANDROID_KEYSTORE_PATH="$CM_BUILD_DIR/android-release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$CM_ENV"
      - name: Analyze and test
        script: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test
      - name: Build signed APK and AAB
        script: |
          set -euo pipefail
          flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"
          flutter build appbundle --release --dart-define=API_BASE_URL="$API_BASE_URL"
          jarsigner -verify -verbose -certs build/app/outputs/flutter-apk/app-release.apk
          jarsigner -verify -verbose -certs build/app/outputs/bundle/release/app-release.aab
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab

  ios_unsigned_check:
    name: iOS unsigned build check
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        API_BASE_URL: https://glukotrack.com/api
        GOOGLE_CLIENT_ID: 967750323381-32r09tkmqfkssusn75ukdjmqh8f0gbs0.apps.googleusercontent.com
        GOOGLE_IOS_CLIENT_ID: 967750323381-32r09tkmqfkssusn75ukdjmqh8f0gbs0.apps.googleusercontent.com
        GOOGLE_SERVER_CLIENT_ID: 967750323381-32r09tkmqfkssusn75ukdjmqh8f0gbs0.apps.googleusercontent.com
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "main"
          include: true
          source: true
    scripts:
      - name: Tool versions
        script: |
          set -euo pipefail
          flutter --version
          dart --version
          xcodebuild -version
          pod --version
      - name: Clean and fetch Flutter packages
        script: |
          set -euo pipefail
          flutter clean
          flutter pub get
      - name: Install CocoaPods
        script: |
          set -euo pipefail
          cd ios
          pod install --repo-update
      - name: Static analysis
        script: |
          set -euo pipefail
          flutter analyze
      - name: Unit and widget tests
        script: |
          set -euo pipefail
          flutter test
      - name: Build unsigned iOS app
        script: |
          set -euo pipefail
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"
      - name: Package unsigned IPA for Sideloadly
        script: |
          set -euo pipefail

          APP_PATH="$CM_BUILD_DIR/build/ios/iphoneos/Runner.app"
          IPA_DIR="$CM_BUILD_DIR/build/ios/ipa"
          PACKAGE_DIR="$CM_BUILD_DIR/build/ios/ipa_payload"
          IPA_PATH="$IPA_DIR/GlukoTrack.ipa"

          test -d "$APP_PATH"
          rm -rf "$IPA_DIR" "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR/Payload" "$IPA_DIR"
          cp -R "$APP_PATH" "$PACKAGE_DIR/Payload/Runner.app"

          (
            cd "$PACKAGE_DIR"
            /usr/bin/zip -qry "$IPA_PATH" Payload
          )

          test -f "$IPA_PATH"
          test -f "$PACKAGE_DIR/Payload/Runner.app/Info.plist"
          test -x "$PACKAGE_DIR/Payload/Runner.app/Runner"
          /usr/bin/unzip -t "$IPA_PATH"
          /usr/bin/unzip -l "$IPA_PATH" | grep -q "Payload/Runner.app/Info.plist"
          /usr/bin/unzip -l "$IPA_PATH" | grep -q "Payload/Runner.app/Runner"

          echo "Created unsigned IPA for Sideloadly: $IPA_PATH"
    artifacts:
      - build/ios/ipa/GlukoTrack.ipa
      - build/**/outputs/**/*.log
      - flutter_drive.log
