workflows:
  ios_unsigned_check:
    name: iOS unsigned build check
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        API_BASE_URL: https://glukotrack.com/api
        GOOGLE_CLIENT_ID: 967750323381-32r09tkmqfkssusn75ukdjmqh8f0gbs0.apps.googleusercontent.com
        GOOGLE_IOS_CLIENT_ID: 967750323381-32r09tkmqfkssusn75ukdjmqh8f0gbs0.apps.googleusercontent.com
        GOOGLE_SERVER_CLIENT_ID: 967750323381-32r09tkmqfkssusn75ukdjmqh8f0gbs0.apps.googleusercontent.com
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "main"
          include: true
          source: true
    scripts:
      - name: Tool versions
        script: |
          set -euo pipefail
          flutter --version
          dart --version
          xcodebuild -version
          pod --version
      - name: Clean and fetch Flutter packages
        script: |
          set -euo pipefail
          flutter clean
          flutter pub get
      - name: Install CocoaPods
        script: |
          set -euo pipefail
          cd ios
          pod install --repo-update
      - name: Static analysis
        script: |
          set -euo pipefail
          flutter analyze
      - name: Unit and widget tests
        script: |
          set -euo pipefail
          flutter test
      - name: Build unsigned iOS app
        script: |
          set -euo pipefail
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            --dart-define=GOOGLE_IOS_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"
      - name: Package unsigned IPA for Sideloadly
        script: |
          set -euo pipefail

          APP_PATH="$CM_BUILD_DIR/build/ios/iphoneos/Runner.app"
          IPA_DIR="$CM_BUILD_DIR/build/ios/ipa"
          PACKAGE_DIR="$CM_BUILD_DIR/build/ios/ipa_payload"
          IPA_PATH="$IPA_DIR/GlukoTrack.ipa"

          test -d "$APP_PATH"
          rm -rf "$IPA_DIR" "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR/Payload" "$IPA_DIR"
          cp -R "$APP_PATH" "$PACKAGE_DIR/Payload/Runner.app"

          (
            cd "$PACKAGE_DIR"
            /usr/bin/zip -qry "$IPA_PATH" Payload
          )

          test -f "$IPA_PATH"
          test -f "$PACKAGE_DIR/Payload/Runner.app/Info.plist"
          test -x "$PACKAGE_DIR/Payload/Runner.app/Runner"
          /usr/bin/unzip -t "$IPA_PATH"
          /usr/bin/unzip -l "$IPA_PATH" | grep -q "Payload/Runner.app/Info.plist"
          /usr/bin/unzip -l "$IPA_PATH" | grep -q "Payload/Runner.app/Runner"

          echo "Created unsigned IPA for Sideloadly: $IPA_PATH"
    artifacts:
      - build/ios/ipa/GlukoTrack.ipa
      - build/**/outputs/**/*.log
      - flutter_drive.log
