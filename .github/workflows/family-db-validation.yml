name: Family DB Validation

on:
  pull_request:
    paths:
      - 'backend/db.js'
      - 'backend/migrations/**'
      - 'backend/scripts/**'
      - '.github/workflows/family-db-validation.yml'
  workflow_dispatch:

jobs:
  validate-family-db:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Start isolated MariaDB with retry
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if docker pull mariadb:11; then break; fi
            if [ "$attempt" -eq 5 ]; then
              echo "MariaDB image pull failed after $attempt attempts"
              exit 1
            fi
            sleep "$((attempt * 10))"
          done
          docker run --detach --name family-db-validation-mariadb \
            --publish 127.0.0.1:3306:3306 \
            --env MARIADB_ROOT_PASSWORD=ci_root_password \
            --health-cmd='healthcheck.sh --connect --innodb_initialized' \
            --health-interval=10s --health-timeout=5s --health-retries=30 \
            mariadb:11
          for attempt in {1..60}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' family-db-validation-mariadb)"
            if [ "$status" = healthy ]; then exit 0; fi
            sleep 2
          done
          docker logs family-db-validation-mariadb
          exit 1
      - name: Create isolated database and restricted user
        run: |
          mysql -h 127.0.0.1 -uroot -pci_root_password <<'SQL'
          CREATE DATABASE glucotrack_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
          CREATE USER 'glucotrack_test_user'@'%' IDENTIFIED BY 'ci_test_password';
          GRANT ALL PRIVILEGES ON glucotrack_test.* TO 'glucotrack_test_user'@'%';
          FLUSH PRIVILEGES;
          SQL
      - name: Install dependencies
        run: npm ci --prefix backend
      - name: Configure test environment
        run: |
          printf '%s\n' 'NODE_ENV=test' 'TEST_DATABASE_HOST=127.0.0.1' 'TEST_DATABASE_PORT=3306' 'TEST_DATABASE_NAME=glucotrack_test' 'TEST_DATABASE_USER=glucotrack_test_user' 'TEST_DATABASE_PASSWORD=ci_test_password' 'DB_AUTO_CREATE=false' > backend/.env.test
      - name: Migrate fresh database
        run: npm run migrate:test --prefix backend
      - name: Verify foundation tables
        run: |
          mysql -h 127.0.0.1 -uglucotrack_test_user -pci_test_password glucotrack_test -N -e "SELECT table_name FROM information_schema.tables WHERE table_schema='glucotrack_test' AND table_name IN ('family_groups','family_members','family_permissions','family_invitations','location_grants','family_links') ORDER BY table_name" | tee /tmp/family-tables
          test "$(wc -l < /tmp/family-tables)" -eq 6
      - name: Repeat migration safely
        run: npm run migrate:test --prefix backend
      - name: Seed and validate Family foundation
        run: |
          npm run seed:test --prefix backend
          mysql -h 127.0.0.1 -uglucotrack_test_user -pci_test_password glucotrack_test -N <<'SQL' > /tmp/family-validation
          SELECT COUNT(*) FROM users WHERE email IN ('patient@test.com','caregiver@test.com','stranger@test.com');
          SELECT can_view_history, can_view_reports FROM family_permissions;
          SELECT COUNT(*) FROM family_members fm JOIN users u ON u.id=fm.user_id WHERE u.email = 'stranger@test.com';
          SQL
          sed -n '1p' /tmp/family-validation | grep -x 3
          sed -n '2p' /tmp/family-validation | grep -x $'1\t0'
          sed -n '3p' /tmp/family-validation | grep -x 0
      - name: Stop isolated MariaDB
        if: always()
        run: docker rm --force family-db-validation-mariadb || true
