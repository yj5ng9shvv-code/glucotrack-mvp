# Family HTTP Smoke workflow registration
name: Family HTTP Smoke
on:
  workflow_dispatch:
  push:
    branches:
      - feature/family-security-clean
jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env: { MARIADB_ROOT_PASSWORD: rootpass }
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: mysql -h127.0.0.1 -uroot -prootpass -e "CREATE DATABASE glucotrack_test; CREATE USER 'test'@'%' IDENTIFIED BY 'testpass'; GRANT ALL ON glucotrack_test.* TO 'test'@'%';"
      - run: npm ci --prefix backend
      - run: |
          printf '%s\n' 'NODE_ENV=test' 'DB_HOST=127.0.0.1' 'DB_PORT=3306' 'DB_NAME=glucotrack_test' 'TEST_DATABASE_NAME=glucotrack_test' 'DB_USER=test' 'DB_PASSWORD=testpass'
          node --env-file=backend/.env.test backend/scripts/migrate-test.mjs
          node --env-file=backend/.env.test backend/scripts/seed-test.mjs
      - run: |
          node --env-file=backend/.env.test backend/server.js >/tmp/api.log 2>&1 & echo $! >/tmp/api.pid
          for n in {1..20}; do curl -fsS http://127.0.0.1:8788/health && break || sleep 1; done
          patient=$(curl -fsS -X POST http://127.0.0.1:8788/auth/login -H 'content-type: application/json' -d '{"email":"patient@test.com","password":"test-password","device":{"id":"test-patient","platform":"web","name":"CI"}}' | node -e 'let d="";process.stdin.on("data",x=>d+=x).on("end",()=>process.stdout.write(JSON.parse(d).token))')
          curl -fsS -X POST http://127.0.0.1:8788/api/family/create -H "Authorization: Bearer $patient"
          curl -fsS http://127.0.0.1:8788/api/family -H "Authorization: Bearer $patient"
      - if: always()
        run: test -f /tmp/api.pid && kill "$(cat /tmp/api.pid)" || true
