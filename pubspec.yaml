name: glucotrack
description: GlucoTrack - AI-assisted diabetes management and safety application.
publish_to: 'none'
version: 0.1.1+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  provider: ^6.1.2
  image_picker: ^1.1.2
  http: ^1.2.2
  http_parser: ^4.1.2
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^10.3.1
  permission_handler: ^13.0.0
  geolocator_platform_interface: ^4.2.8
  geolocator_android: ^5.0.3
  geolocator_apple: ^2.3.14
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^17.2.4
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  fl_chart: ^0.69.0
  qr_flutter: ^4.1.0
  cupertino_icons: ^1.0.8

  web: any
  google_sign_in: 7.2.0
  google_sign_in_web: 1.1.3
  sign_in_with_apple: ^7.0.1
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/core.json
